<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFD1E5">
  <meta name="color-scheme" content="light">
  <title>NADOOSHTTY — THE ULTIMATE BIRTHDAY EXPERIENCE 🎂❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
/* =========================================================
   NADOOSHTTY — Birthday Experience
   ========================================================= */

:root {
  --pink: #FFE1EF;
  --pink-strong: #FFB8D8;
  --pink-soft: #FFD1E5;
  --lavender: #E5D5FF;
  --lavender-strong: #DCC8FF;
  --cream: #FFF7E8;
  --warm-white: #FFFCF8;
  --peach: #FFDCCB;
  --coral: #FFBDB5;
  --yellow: #FFF0B8;
  --blue: #D9EEFF;
  --gold: #EBCB91;

  --accent-rose: #FF4D8D;
  --accent-pink-deep: #E6397A;
  --accent-lavender-deep: #9B6BFF;
  --accent-gold: #D4AF37;

  --text-primary: #4A153B;
  --text-secondary: #7A3E65;

  --card-surface: rgba(255, 255, 255, 0.88);
  --card-border: rgba(255, 130, 180, 0.45);
  --soft-glow: 0 15px 40px rgba(255, 105, 165, 0.18);

  --font-ar: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  --font-display: 'Fredoka', 'Cairo', system-ui, sans-serif;
  --ease: cubic-bezier(.22, .8, .26, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ar);
  color: var(--text-primary);
  background: var(--pink);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }

/* =========================================================
   Backgrounds
   ========================================================= */
.backdrop { position: fixed; inset: 0; z-index: 0; }
.bg { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; }
.bg.on { opacity: 1; }

.bg[data-bg="welcome"] {
  background:
    radial-gradient(60% 50% at 15% 10%, #FFB8D8 0%, transparent 70%),
    radial-gradient(55% 45% at 90% 15%, #E5D5FF 0%, transparent 70%),
    radial-gradient(60% 55% at 85% 92%, #FFDCCB 0%, transparent 70%),
    radial-gradient(50% 45% at 8% 92%, #D9EEFF 0%, transparent 70%),
    linear-gradient(160deg, #FFE1EF, #FFF7E8);
}
.bg[data-bg="countdown"] {
  background:
    radial-gradient(circle at 50% 46%, #FFF0B8 0%, transparent 38%),
    radial-gradient(70% 60% at 18% 85%, #FFB8D8 0%, transparent 70%),
    radial-gradient(70% 60% at 88% 12%, #DCC8FF 0%, transparent 70%),
    linear-gradient(180deg, #FFD1E5, #E5D5FF);
}
.bg[data-bg="reveal"] {
  background:
    radial-gradient(circle at 50% 30%, #FFF7E8 0%, transparent 45%),
    radial-gradient(60% 50% at 8% 100%, #FFBDB5 0%, transparent 70%),
    radial-gradient(60% 50% at 96% 0%, #DCC8FF 0%, transparent 70%),
    linear-gradient(170deg, #FFB8D8, #FFE1EF 55%, #FFF0B8);
}
.bg[data-bg="theme1"] {
  background:
    radial-gradient(55% 45% at 10% 10%, #FFB8D8 0%, transparent 70%),
    radial-gradient(55% 45% at 92% 90%, #DCC8FF 0%, transparent 70%),
    linear-gradient(160deg, #FFE1EF, #FFF7E8 50%, #E5D5FF);
}
.bg[data-bg="theme2"] {
  background:
    radial-gradient(60% 50% at 18% 18%, #FF9CC8 0%, transparent 65%),
    radial-gradient(60% 50% at 88% 85%, #FFD1E5 0%, transparent 70%),
    linear-gradient(160deg, #FFB8D8, #FFE1EF 60%, #FFF0B8);
}
.bg[data-bg="theme3"] {
  background:
    radial-gradient(60% 50% at 85% 12%, #E5D5FF 0%, transparent 70%),
    radial-gradient(60% 50% at 10% 90%, #FFBDB5 0%, transparent 70%),
    linear-gradient(150deg, #FFDCCB, #FFD1E5 50%, #E5D5FF);
}
.bg[data-bg="theme4"] {
  background:
    radial-gradient(55% 45% at 12% 12%, #FFF0B8 0%, transparent 70%),
    radial-gradient(55% 45% at 90% 20%, #D9EEFF 0%, transparent 70%),
    linear-gradient(150deg, #FFF0B8, #D9EEFF 55%, #FFD1E5);
}
.bg[data-bg="theme5"] {
  background:
    radial-gradient(50% 45% at 50% 8%, #FFF7E8 0%, transparent 70%),
    radial-gradient(55% 45% at 10% 95%, #E5D5FF 0%, transparent 70%),
    linear-gradient(150deg, #FFF7E8, #F6E3BD 28%, #FFD1E5 65%, #E5D5FF);
}
.bg[data-bg="finale"] {
  background:
    radial-gradient(circle at 50% 44%, #FFF7E8 0%, transparent 46%),
    radial-gradient(55% 45% at 8% 8%, #FFF0B8 0%, transparent 70%),
    linear-gradient(160deg, #FFB8D8, #E5D5FF 55%, #FFDCCB);
}

/* =========================================================
   Floaters (hearts, flowers, sparkles)
   ========================================================= */
.floaters { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.fl {
  position: absolute;
  bottom: -12vh;
  line-height: 1;
  opacity: 0;
  will-change: transform, opacity;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
  10%  { opacity: .85; }
  88%  { opacity: .85; }
  100% { transform: translate3d(var(--dx, 0), -120vh, 0) rotate(var(--rot, 0deg)); opacity: 0; }
}

/* =========================================================
   Scenes
   ========================================================= */
.scene {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  opacity: 0;
  visibility: hidden;
  transition: opacity .6s ease, visibility 0s linear .6s;
}
.scene.active {
  opacity: 1;
  visibility: visible;
  transition: opacity .6s ease .15s, visibility 0s;
}

/* =========================================================
   Buttons
   ========================================================= */
.btn {
  font-weight: 700;
  font-size: 1rem;
  line-height: 1.2;
  min-height: 46px;
  padding: .8em 1.4em;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .2s var(--ease), box-shadow .2s ease, opacity .2s ease;
}
.btn-primary {
  color: #fff;
  background: linear-gradient(135deg, var(--accent-pink-deep), var(--accent-lavender-deep));
  box-shadow: 0 10px 24px rgba(230, 57, 122, .35), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.btn-soft {
  color: var(--text-primary);
  background: rgba(255, 255, 255, .92);
  border: 2px solid var(--card-border);
  box-shadow: 0 6px 16px rgba(255, 105, 165, .18);
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn:focus-visible,
.dot:focus-visible,
.close-btn:focus-visible,
.music-toggle:focus-visible {
  outline: 3px solid var(--accent-lavender-deep);
  outline-offset: 3px;
}
.btn-xl { font-size: clamp(1.05rem, 3.6vw, 1.35rem); padding: 1em 1.8em; }
.btn-pulse { animation: btnPulse 2.4s ease-in-out infinite; }
@keyframes btnPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.045); }
}
.btn-pulse:hover { animation-play-state: paused; }

/* =========================================================
   Scene 1 — Welcome
   ========================================================= */
.welcome-inner {
  margin: auto;
  max-width: 640px;
  padding: 1rem 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 1.1rem;
}
.eyebrow {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: .72rem;
  line-height: 1.6;
  letter-spacing: .14em;
  color: var(--accent-pink-deep);
  background: rgba(255, 255, 255, .78);
  border: 1.5px solid var(--card-border);
  padding: .45em 1em;
  border-radius: 999px;
  max-width: 100%;
}
.gift { position: relative; display: grid; place-items: center; }
.gift-emoji {
  position: relative;
  font-size: clamp(4.5rem, 18vw, 7rem);
  line-height: 1;
  animation: giftBob 3s ease-in-out infinite;
}
.gift-halo {
  position: absolute;
  inset: -35%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .95), rgba(255, 184, 216, 0) 65%);
  animation: haloPulse 3s ease-in-out infinite;
}
@keyframes giftBob {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-10px) rotate(3deg); }
}
@keyframes haloPulse {
  0%, 100% { transform: scale(.9); opacity: .7; }
  50% { transform: scale(1.1); opacity: 1; }
}
.welcome-title {
  font-size: clamp(2rem, 8vw, 3.4rem);
  font-weight: 800;
  line-height: 1.35;
  color: var(--accent-pink-deep);
  text-shadow: 0 3px 0 #fff, 0 10px 28px rgba(255, 77, 141, .28);
}
.welcome-sub {
  font-size: clamp(1rem, 3.4vw, 1.2rem);
  line-height: 1.9;
  font-weight: 600;
  color: var(--text-secondary);
  max-width: 30em;
}

/* =========================================================
   Scene 2 — Countdown
   ========================================================= */
#scene-countdown { align-items: center; text-align: center; }
.count-caption {
  margin-top: auto;
  padding-top: 1rem;
  font-weight: 700;
  font-size: clamp(1rem, 3.5vw, 1.3rem);
  color: var(--text-secondary);
}
.count-num {
  margin: 0 auto auto;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(9rem, 42vw, 24rem);
  line-height: 1.05;
  min-height: 1.05em;
  background: linear-gradient(180deg, #FF7DB0 0%, #E6397A 55%, #9B6BFF 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  filter: drop-shadow(0 0 22px rgba(255, 255, 255, .95)) drop-shadow(0 12px 28px rgba(230, 57, 122, .3));
}
.count-num.tick { animation: numPop 1s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes numPop {
  0%   { opacity: 0; transform: scale(.35) rotate(-6deg); }
  25%  { opacity: 1; transform: scale(1.12) rotate(2deg); }
  45%  { transform: scale(1) rotate(0); }
  85%  { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.25); }
}

/* =========================================================
   Scene 3 — Reveal
   ========================================================= */
.reveal-inner {
  margin: auto;
  max-width: 1000px;
  padding: 1rem 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: clamp(1.6rem, 6vh, 3rem);
}
.birthday-title {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .04em .3em;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.6rem, 10.5vw, 6.4rem);
  line-height: 1.12;
}
.tw {
  display: inline-block;
  opacity: 0;
  text-shadow: 0 .06em 0 #fff, 0 .16em .32em rgba(230, 57, 122, .35);
}
.tw:nth-child(1) { color: #E6397A; }
.tw:nth-child(2) { color: #8A55F5; }
.tw:nth-child(3) { color: #D12D7A; }
.tw:nth-child(4) { color: #E8553C; }
.tw-emoji { text-shadow: none; }
#scene-reveal.active .tw {
  animation: twIn 1s cubic-bezier(.2, 1.2, .3, 1) both;
  animation-delay: calc(var(--i) * .2s + .3s);
}
@keyframes twIn {
  from { opacity: 0; transform: translateY(40px) scale(.6) rotate(-6deg); }
  to   { opacity: 1; transform: none; }
}
.reveal-btn { opacity: 0; }
#scene-reveal.active .reveal-btn { animation: fadeUp .9s ease 2s both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: none; }
}

/* =========================================================
   Scene 4 — Scrapbook
   ========================================================= */
#scene-scrapbook {
  padding: 0;
  overflow: hidden;

  /* default theme (message 1) */
  --accent: #E6397A;
  --accent2: #9B6BFF;
  --heading: #C42B6D;
  --glow: #FFB8D8;
  --gold-deep: #B8892B;
  --paper-a: #FFFDF7;
  --paper-b: #FFF1F6;
  --edge1: #F5DDE8;
  --edge2: #EBC9DA;
  --tape-a: rgba(255, 184, 216, .92);
  --tape-b: rgba(255, 255, 255, .78);
  --st1: "🌸";
  --st2: "💗";
  --fade: rgba(255, 225, 239, .96);
  --frame-bg: #fff;
  --frame-border: transparent;
}
#scene-scrapbook[data-msg="2"] {
  --accent: #FF4D8D; --accent2: #FF9A76; --heading: #D81B6A; --glow: #FF9CC8;
  --paper-a: #FFF6FA; --paper-b: #FFE3F0; --edge1: #FAD2E4; --edge2: #F0B9D1;
  --tape-a: rgba(255, 189, 181, .95); --tape-b: rgba(255, 255, 255, .8);
  --st1: "💕"; --st2: "🎀"; --fade: rgba(255, 209, 229, .96);
}
#scene-scrapbook[data-msg="3"] {
  --accent: #E6397A; --accent2: #FF9A76; --heading: #A83C6A; --glow: #FFDCCB;
  --paper-a: #FFF9F3; --paper-b: #FFE8DA; --edge1: #F6DCCB; --edge2: #EBC5AE;
  --tape-a: rgba(229, 213, 255, .95); --tape-b: rgba(255, 255, 255, .8);
  --st1: "✨"; --st2: "🌷"; --fade: rgba(255, 220, 203, .96);
}
#scene-scrapbook[data-msg="4"] {
  --accent: #E6397A; --accent2: #4FB3FF; --heading: #C9327A; --glow: #FFF0B8;
  --paper-a: #FFFDF0; --paper-b: #EAF6FF; --edge1: #E6EEC4; --edge2: #CFE3F2;
  --tape-a: rgba(255, 240, 184, .98); --tape-b: rgba(217, 238, 255, .9);
  --st1: "🌼"; --st2: "🌻"; --fade: rgba(255, 240, 184, .96);
}
#scene-scrapbook[data-msg="5"] {
  --accent: #D4AF37; --accent2: #E6397A; --heading: #9B3F6E; --glow: #FFF0B8;
  --paper-a: #FFFAF0; --paper-b: #FFF0DD; --edge1: #F2E2BF; --edge2: #E5CC97;
  --tape-a: rgba(235, 203, 145, .95); --tape-b: rgba(255, 255, 255, .8);
  --st1: "🌟"; --st2: "💫"; --fade: rgba(255, 247, 232, .96);
  --frame-bg: linear-gradient(135deg, #FFF7E8, #F6E3BD);
  --frame-border: #EBCB91;
}

.close-btn {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  right: 14px;
  z-index: 6;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 2px solid var(--card-border);
  background: rgba(255, 255, 255, .92);
  color: var(--accent-pink-deep);
  font-size: 1.15rem;
  font-weight: 800;
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: 0 6px 16px rgba(255, 105, 165, .2);
  transition: transform .2s var(--ease);
}
.close-btn:hover { transform: scale(1.08) rotate(6deg); }

.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  overflow-y: auto;
  padding: clamp(64px, 9vh, 84px) clamp(14px, 3vw, 32px) 0;
  -webkit-overflow-scrolling: touch;
}
.book-wrap {
  margin: auto 0;
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 14px 0 20px;
  perspective: 1400px;
}

/* The book */
.book {
  --turn: 1;
  --photo-max-h: min(66vh, 620px);
  position: relative;
  direction: ltr;
  width: min(100%, 1080px);
  display: grid;
  align-items: center;
  gap: clamp(14px, 2.4vw, 34px);
  padding: clamp(20px, 3.4vw, 46px);
  border-radius: 22px 26px 26px 22px;
  background:
    radial-gradient(circle at 12% 18%, rgba(255, 184, 216, .2) 0 2px, transparent 3px) 0 0 / 46px 46px,
    radial-gradient(circle at 70% 60%, rgba(220, 200, 255, .24) 0 1.5px, transparent 2.5px) 0 0 / 58px 58px,
    linear-gradient(135deg, var(--paper-a), var(--paper-b));
  box-shadow:
    inset 0 1px 0 #fff,
    0 2px 0 var(--edge1),
    0 4px 0 var(--edge2),
    0 6px 0 var(--edge1),
    0 8px 0 var(--edge2),
    0 24px 44px rgba(122, 62, 101, .2);
  outline: 2px dashed rgba(230, 57, 122, .26);
  outline-offset: -10px;
  transition: opacity .28s ease, transform .28s var(--ease);
}
.book.leaving {
  opacity: 0;
  transform: translateX(calc(var(--turn) * -38px)) rotateY(calc(var(--turn) * 9deg));
}
.book.entering { animation: bookIn .46s var(--ease) both; }
@keyframes bookIn {
  from { opacity: 0; transform: translateX(calc(var(--turn) * 38px)) rotateY(calc(var(--turn) * -9deg)); }
  to   { opacity: 1; transform: none; }
}

/* Corner stickers */
.book::before,
.book::after {
  position: absolute;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  line-height: 1;
  pointer-events: none;
  z-index: 2;
  animation: bob 4s ease-in-out infinite;
}
.book::before { content: var(--st1); top: -16px; right: -10px; transform: rotate(12deg); }
.book::after  { content: var(--st2); bottom: -14px; left: -8px; transform: rotate(-12deg); animation-delay: -2s; }
@keyframes bob {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -6px; }
}

/* Spine */
.spine {
  position: absolute;
  top: 10px;
  bottom: 10px;
  left: 50%;
  width: 28px;
  transform: translateX(-50%);
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(122, 62, 101, .09) 40%, rgba(255, 255, 255, .6) 50%, rgba(122, 62, 101, .09) 60%, transparent);
}
.spine::after {
  content: "";
  position: absolute;
  top: 12px;
  bottom: 12px;
  left: 50%;
  border-left: 2px dashed rgba(155, 107, 255, .35);
}

/* Layouts */
.photo-slot { grid-area: photo; }
.page-text  { grid-area: text; }

.book[data-layout="side-a"] { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "photo text"; --tilt: -2.2deg; }
.book[data-layout="side-b"] { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "text photo"; --tilt: 2deg; }
.book[data-layout="top"]    { grid-template-columns: minmax(0, 1fr); grid-template-areas: "photo" "text"; width: min(100%, 780px); --tilt: -1.2deg; --photo-max-h: min(42vh, 440px); }
.book[data-layout="bottom"] { grid-template-columns: minmax(0, 1fr); grid-template-areas: "text" "photo"; width: min(100%, 780px); --tilt: 1.6deg; --photo-max-h: min(42vh, 440px); }
.book[data-layout^="side"] .spine { opacity: 1; }

/* Photograph — keeps its natural ratio (--ar is set from naturalWidth/Height) */
.photo-slot {
  margin: 0;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  direction: ltr;
}
.photo-frame {
  position: relative;
  width: min(100%, calc(var(--photo-max-h) * var(--ar, 1.3333) + 24px));
  padding: 12px 12px 32px;
  background: var(--frame-bg);
  border: 3px solid var(--frame-border);
  border-radius: 6px;
  box-shadow: 0 10px 28px rgba(122, 62, 101, .22), 0 0 0 1px rgba(255, 130, 180, .25);
  transform: rotate(var(--tilt, -2deg));
  transition: transform .4s var(--ease);
}
.photo-frame:hover { transform: rotate(0deg) scale(1.01); }
.photo-frame::before {
  content: "";
  position: absolute;
  top: -14px;
  left: 50%;
  width: 92px;
  height: 26px;
  transform: translateX(-50%) rotate(-3deg);
  background: repeating-linear-gradient(45deg, var(--tape-a) 0 8px, var(--tape-b) 8px 16px);
  box-shadow: 0 2px 6px rgba(122, 62, 101, .16);
  z-index: 1;
}
.photo-frame img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  border-radius: 3px;
  background: var(--pink);
}
.photo-fallback {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .3rem;
  aspect-ratio: 4 / 3;
  text-align: center;
  border-radius: 3px;
  color: var(--text-secondary);
  background:
    radial-gradient(circle at 25% 25%, #FFD1E5, transparent 60%),
    radial-gradient(circle at 80% 80%, #E5D5FF, transparent 60%),
    var(--cream);
}
.photo-fallback span { font-size: 3rem; }
.photo-fallback b { font-size: 1.1rem; }
.photo-fallback small { font-family: var(--font-display); opacity: .75; }
.photo-frame.no-photo img { display: none; }
.photo-frame.no-photo .photo-fallback { display: flex; }

/* Text page */
.page-text {
  position: relative;
  direction: rtl;
  text-align: right;
  min-width: 0;

.rev-glow    { --rev: revGlow 1.1s ease; }
.rev-sweep   { --rev: revSweep .8s var(--ease); }
.rev-shimmer { --rev: revShimmer 1.3s ease; }

.msg-body.is-done .w {
  animation: none;
  opacity: 1;
  top: 0;
  left: 0;
  text-shadow: none;
}
@keyframes revFade {
  from { opacity: 0; top: .35em; }
  to   { opacity: 1; top: 0; }
}
@keyframes revPop {
  0%   { opacity: 0; top: .9em; color: var(--accent); }
  60%  { opacity: 1; top: -.15em; color: var(--accent); }
  100% { opacity: 1; top: 0; color: var(--text-primary); }
}
@keyframes revGlow {
  0%   { opacity: 0; text-shadow: 0 0 0 rgba(255, 255, 255, 0); }
  40%  { opacity: 1; text-shadow: 0 0 18px var(--glow), 0 0 4px #fff; }
  100% { opacity: 1; text-shadow: 0 0 0 rgba(255, 255, 255, 0); }
}
@keyframes revSweep {
  from { opacity: 0; left: 1.2em; }
  to   { opacity: 1; left: 0; }
}
@keyframes revShimmer {
  0%   { opacity: 0; top: .2em; color: var(--gold-deep); }
  50%  { opacity: 1; color: var(--gold-deep); text-shadow: 0 0 14px rgba(235, 203, 145, .95), 0 0 28px rgba(255, 184, 216, .7); }
  100% { opacity: 1; top: 0; color: var(--text-primary); text-shadow: 0 0 0 rgba(255, 255, 255, 0); }

        rot: rand(0, 6.28), vr: rand(-0.25, 0.25),
        c: COLORS[(Math.random() * COLORS.length) | 0],
        life: rand(110, 190),
        shape: r < 0.18 ? 'heart' : (r < 0.45 ? 'dot' : 'rect')
      });
    }

    function step() {
      ctx.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.vy += 0.11;
        p.vx *= 0.992;
        p.vy *= 0.992;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life--;
        if (p.life <= 0 || p.y > H + 30) { parts.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.min(1, p.life / 40);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        if (p.shape === 'heart') {
          ctx.font = (p.w * 2) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('\u2665', 0, 0);
        } else if (p.shape === 'dot') {
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2.4, 0, 6.2832);
          ctx.fill();
        } else {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        ctx.restore();
      }
      if (parts.length) {
        raf = requestAnimationFrame(step);
      } else {
        raf = 0;
        ctx.clearRect(0, 0, W, H);
      }
    }

    function kick() { if (!raf && parts.length) raf = requestAnimationFrame(step); }

    function cannon(x, y, deg, n, speed) {
      const a = deg * Math.PI / 180;
      for (let i = 0; i < n; i++) spawn(x, y, a, speed, 0.35);
    }

    function burst(x, y, n) {
      if (isReduced()) return;
      for (let i = 0; i < n; i++) spawn(x, y, rand(0, 6.2832), 7, 0);
      kick();
    }

    function celebrate() {
      if (isReduced()) return;
      const n = isSmall() ? 22 : 40;
      cannon(0, H * 0.9, -62, n, 13);
      cannon(W, H * 0.9, -118, n, 13);
      kick();
      later(function () {
        cannon(0, H * 0.9, -70, n, 12);
        cannon(W, H * 0.9, -110, n, 12);
        kick();
      }, 450);
      [0, 500, 1000].forEach(function (d) {
        later(function () {
          const rn = isSmall() ? 14 : 24;
          for (let i = 0; i < rn; i++) spawn(rand(0, W), -12, Math.PI / 2, 3.2, 0.5);
          kick();
        }, d);
      });
    }

    function clear() {
      parts = [];
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      ctx.clearRect(0, 0, W, H);
    }

    resize();
    return { resize: resize, burst: burst, celebrate: celebrate, clear: clear, size: function () { return { W: W, H: H }; } };
  })();

  /* ---------------------------------------------------------
     Finale: particles gather into a symmetrical heart
     --------------------------------------------------------- */
  const heart = (function () {
    const cv = $('#heart');
    const ctx = cv.getContext('2d');
    const scene = scenes.finale;
    const COLS = ['#FF4D8D', '#E6397A', '#FFB8D8', '#DCC8FF', '#9B6BFF', '#EBCB91', '#FFBDB5'];
    let W = 0, H = 0, cx = 0, cy = 0;
    let pts = [];
    let raf = 0, active = false, t0 = 0;

    function size() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function curve(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
      };
    }

    function build() {
      // Sample the curve evenly by arc length
      const SAMPLES = 720;
      const samp = [];
      let acc = 0;
      let prev = curve(0);
      let minX = prev.x, maxX = prev.x, minY = prev.y, maxY = prev.y;
      samp.push({ x: prev.x, y: prev.y, L: 0 });
      for (let i = 1; i <= SAMPLES; i++) {
        const p = curve(i / SAMPLES * Math.PI * 2);
        acc += Math.hypot(p.x - prev.x, p.y - prev.y);
        samp.push({ x: p.x, y: p.y, L: acc });
        prev = p;
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      const bw = maxX - minX, bh = maxY - minY;
      const mx = (minX + maxX) / 2, my = (minY + maxY) / 2;

      const area = Math.max(H - 118, 200);
      const hw = Math.min(W * 0.82, area * 0.9 * (bw / bh), 620);
      const k = hw / bw;
      cx = W / 2;
      cy = area / 2 + 10;
      scene.style.setProperty('--heart-w', hw.toFixed(1) + 'px');
      scene.style.setProperty('--heart-cy', cy.toFixed(1) + 'px');

      function at(l) {
        let lo = 0, hi = samp.length - 1;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (samp[mid].L < l) lo = mid + 1; else hi = mid;
        }
        return samp[lo];
      }

      const total = W < 600 ? 230 : 380;
      const layers = [[1, 0.36], [0.82, 0.26], [0.64, 0.18], [0.46, 0.12], [0.28, 0.08]];
      const rs = Math.min(1.3, Math.max(0.7, hw / 460));
      const R = Math.hypot(W, H) * 0.6;
      pts = [];

      layers.forEach(function (layer, li) {
        const s = layer[0];
        const n = Math.round(total * layer[1]);
        for (let j = 0; j < n; j++) {
          const sp = at((j + 0.5) / n * acc);
          const tx = cx + (sp.x - mx) * k * s + rand(-0.6, 0.6);
          const ty = cy + (sp.y - my) * k * s + rand(-0.6, 0.6);
          const a = rand(0, Math.PI * 2);
          const sx = W / 2 + Math.cos(a) * R;
          const sy = H / 2 + Math.sin(a) * R;
          const dx = tx - sx, dy = ty - sy;
          const len = Math.hypot(dx, dy) || 1;
          pts.push({
            tx: tx, ty: ty, sx: sx, sy: sy,
            px: -dy / len, py: dx / len,
            swirl: rand(-90, 90),
            delay: rand(0, 1300) + li * 120,
            dur: rand(1500, 2300),
            r: rand(2.2, 4.2) * rs,
            col: COLS[(Math.random() * COLS.length) | 0],
            ph: rand(0, 6.28)
          });
        }
      });
    }

    function render(t) {
      ctx.clearRect(0, 0, W, H);
      const settle = Math.min(1, Math.max(0, (t - 3200) / 900));
      const beat = 1 + 0.028 * settle * Math.sin(t / 1000 * Math.PI * 2 / 1.3);
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        let e = (t - p.delay) / p.dur;
        if (e <= 0) continue;
        if (e > 1) e = 1;
        const ee = 1 - Math.pow(1 - e, 3);
        let x = p.sx + (p.tx - p.sx) * ee;
        let y = p.sy + (p.ty - p.sy) * ee;
        const w = Math.sin(ee * Math.PI) * p.swirl;
        x += p.px * w;
        y += p.py * w;
        if (e === 1) {
          x += Math.sin(t / 700 + p.ph) * 1.3;
          y += Math.cos(t / 800 + p.ph) * 1.3;
        }
        x = cx + (x - cx) * beat;
        y = cy + (y - cy) * beat;
        const a = Math.min(1, e * 3);
        ctx.fillStyle = p.col;
        ctx.globalAlpha = 0.16 * a;
        ctx.beginPath();
        ctx.arc(x, y, p.r * 2.7, 0, 6.2832);
        ctx.fill();
        ctx.globalAlpha = 0.95 * a;
        ctx.beginPath();
        ctx.arc(x, y, p.r, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function loop(now) {
      if (!active) return;
      render(now - t0);
      raf = requestAnimationFrame(loop);
    }

    function layout() {
      size();
      build();
      if (active && isReduced()) render(10000);
    }

    function start() {
      stop();
      layout();
      active = true;
      if (isReduced()) {
        render(10000);
      } else {
        t0 = performance.now();
        raf = requestAnimationFrame(loop);
      }
    }

    function stop() {
      active = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      ctx.clearRect(0, 0, W, H);
    }

    layout();
    return { start: start, stop: stop, layout: layout, isActive: function () { return active; } };
  })();

  /* ---------------------------------------------------------
     Scene manager
     --------------------------------------------------------- */
  let current = 'welcome';
  let transitioning = false;

  function setBg(key) {
    bgEls.forEach(function (el) { el.classList.toggle('on', el.dataset.bg === key); });
  }

  function show(name) {
    current = name;
    Object.keys(scenes).forEach(function (k) {
      const el = scenes[k];
      const on = k === name;
      el.classList.toggle('active', on);
      el.setAttribute('aria-hidden', on ? 'false' : 'true');
      el.inert = !on;
    });
    document.body.dataset.scene = name;
    if (name !== 'scrapbook') setBg(name);
  }

  function go(name) {
    if (transitioning || current === name) return false;
    const prev = current;
    transitioning = true;
    show(name);
    later(function () { transitioning = false; }, 650);

    if (prev === 'finale' && name !== 'finale') {
      later(function () { if (current !== 'finale') heart.stop(); }, 750);
    }
    if (name === 'reveal') {
      later(function () { if (current === 'reveal') fx.celebrate(); }, 350);
    }
    if (name === 'finale') {
      later(function () { if (current === 'finale') heart.start(); }, 350);
      later(function () { if (current === 'finale') fx.celebrate(); }, 3000);
    }
    return true;
  }

  /* ---------------------------------------------------------
     Music
     --------------------------------------------------------- */
  function syncMusicUI() {
    const playing = !audio.paused;
    musicBtn.setAttribute('aria-pressed', String(playing));
    musicBtn.classList.toggle('playing', playing);
    musicIcon.textContent = playing ? '🔊' : '🔇';
  }

  audio.addEventListener('play', syncMusicUI);
  audio.addEventListener('pause', syncMusicUI);
  audio.addEventListener('error', function () {
    toast('ملف الموسيقى مش لاقيينه — اتأكدي إنه في فولدر audio بالاسم الصح 🎵');
  });

  musicBtn.addEventListener('click', function () {
    if (audio.paused) {
      const p = audio.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function () { toast('المتصفح منع تشغيل الموسيقى — جربي تدوسي تاني 🎵'); });
      }
    } else {
      audio.pause();
    }
  });

  /* ---------------------------------------------------------
     Scene 1 → 2 → 3
     --------------------------------------------------------- */
  let started = false;

  function tick(n) {
    countNum.textContent = String(n);
    countNum.classList.remove('tick');
    void countNum.offsetWidth; // restart animation
    countNum.classList.add('tick');
    const s = fx.size();
    fx.burst(s.W / 2, s.H / 2, isSmall() ? 10 : 18);
  }

  function runCountdown() {
    [3, 2, 1].forEach(function (n, i) {
      later(function () { tick(n); }, 300 + i * 1000);
    });
    later(function () { go('reveal'); }, 300 + 3 * 1000);
  }

  startBtn.addEventListener('click', function () {
    if (started) return;
    started = true;
    startBtn.disabled = true;
    musicBtn.classList.add('visible');

    const p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function () {
        syncMusicUI();
        toast('دوسي على زرار الموسيقى 🎵 عشان تشغلي الأغنية');
      });
    }
    syncMusicUI();

    if (go('countdown')) {
      countNum.textContent = '';
      runCountdown();
    } else {
      started = false;
      startBtn.disabled = false;
    }
  });

  openBtn.addEventListener('click', function () { openScrapbook(); });

  /* ---------------------------------------------------------
     Photograph — keeps natural proportions, graceful fallback
     --------------------------------------------------------- */
  function onPhotoLoad() {
    if (photo.naturalWidth > 0 && photo.naturalHeight > 0) {
      photoFrame.style.setProperty('--ar', (photo.naturalWidth / photo.naturalHeight).toFixed(4));
      photoFrame.classList.remove('no-photo');
    } else {
      onPhotoFail();
    }
  }
  function onPhotoFail() {
    photoFrame.classList.add('no-photo');
    photoFrame.style.removeProperty('--ar');
  }
  photo.addEventListener('load', onPhotoLoad);
  photo.addEventListener('error', onPhotoFail);
  if (photo.complete) {
    if (photo.naturalWidth > 0) onPhotoLoad(); else onPhotoFail();
  }

  /* ---------------------------------------------------------
     Scrapbook
     --------------------------------------------------------- */
  let idx = 0;
  let busy = false;
  let revealTimer = 0;

  // Dots
  const dotEls = MESSAGES.map(function (m, i) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dot';
    b.setAttribute('aria-label', 'الرسالة ' + (i + 1));
    b.addEventListener('click', function () { goTo(i); });
    dotsEl.appendChild(b);
    return b;
  });

  function finishReveal() {
    clearTimeout(revealTimer);
    bodyEl.classList.add('is-done');
    skipBtn.disabled = true;
  }

  function buildBody(m) {
    bodyEl.replaceChildren();
    bodyEl.className = 'msg-body rev-' + m.rev;

    // Split into words + whitespace; whitespace (incl. line breaks) is kept as-is
    const words = [];
    m.text.split(/(\s+)/).forEach(function (tk) {
      if (!tk) return;
      if (/^\s+$/.test(tk)) {
        bodyEl.appendChild(document.createTextNode(tk));
        return;
      }
      const span = document.createElement('span');
      span.className = 'w';
      span.textContent = tk;
      bodyEl.appendChild(span);
      words.push(span);
    });

    if (isReduced()) {
      bodyEl.classList.add('is-done');
      skipBtn.disabled = true;
      return;
    }
    skipBtn.disabled = false;

    let maxDelay = 0;
    if (m.rev === 'sweep') {
      // Real line-by-line reveal: group words by their visual line
      let line = -1, lastTop = null, rank = 0;
      words.forEach(function (w) {
        const top = w.offsetTop;
        if (lastTop === null || Math.abs(top - lastTop) > 4) { line++; lastTop = top; rank = 0; }
        const d = line * 560 + rank * 45;
        rank++;
        w.style.animationDelay = d + 'ms';
        if (d > maxDelay) maxDelay = d;
      });
    } else {
      const step = Math.min(WORD_STEP[m.rev], 5200 / Math.max(words.length, 1));
      words.forEach(function (w, i) {
        const d = 420 + i * step;
        w.style.animationDelay = d + 'ms';
        if (d > maxDelay) maxDelay = d;
      });
    }
    revealTimer = later(finishReveal, maxDelay + 1400);
  }

  function render(i) {
    clearTimeout(revealTimer);
    idx = i;
    const m = MESSAGES[i];

    scenes.scrapbook.dataset.msg = String(i + 1);
    book.dataset.layout = m.layout;
    headingEl.textContent = m.heading;
    counterEl.textContent = (i + 1) + ' / ' + N;

    dotEls.forEach(function (d, k) {
      if (k === i) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current');
    });
    prevBtn.disabled = i === 0;
    nextBtn.textContent = i === N - 1 ? 'الخاتمة ✨' : 'التالية ←';

    buildBody(m);
    stage.scrollTop = 0;
    setBg('theme' + (i + 1));
  }

  function goTo(i) {
    if (busy || i === idx || i < 0 || i >= N || current !== 'scrapbook') return;
    busy = true;
    book.style.setProperty('--turn', i > idx ? '1' : '-1');
    book.classList.add('leaving');
    later(function () {
      render(i);
      book.classList.remove('leaving');
      book.classList.add('entering');
      later(function () {
        book.classList.remove('entering');
        busy = false;
      }, 460);
    }, 280);
  }

  function openScrapbook() {
    if (!go('scrapbook')) return;
    busy = false;
    book.classList.remove('leaving', 'entering');
    render(0);
    book.classList.add('entering');
    later(function () { book.classList.remove('entering'); }, 480);
  }

  function closeScrapbook() {
    if (current !== 'scrapbook') return;
    clearTimeout(revealTimer);
    go('finale');
  }

  function next() {
    if (busy || current !== 'scrapbook') return;
    if (idx === N - 1) closeScrapbook(); else goTo(idx + 1);
  }
  function prev() {
    if (busy || current !== 'scrapbook') return;
    goTo(idx - 1);
  }

  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  skipBtn.addEventListener('click', finishReveal);
  closeBtn.addEventListener('click', closeScrapbook);

  document.addEventListener('keydown', function (e) {
    if (current !== 'scrapbook') return;
    if (e.key === 'ArrowLeft') next();
    else if (e.key === 'ArrowRight') prev();
    else if (e.key === 'Escape') closeScrapbook();
  });

  /* ---------------------------------------------------------
     Finale buttons
     --------------------------------------------------------- */
  reopenBtn.addEventListener('click', openScrapbook);

  replayBtn.addEventListener('click', function () {
    if (transitioning) return;
    clearTimers();
    heart.stop();
    fx.clear();
    started = false;
    busy = false;
    idx = 0;
    startBtn.disabled = false;
    countNum.textContent = '';
    countNum.classList.remove('tick');
    audio.pause();
    try { audio.currentTime = 0; } catch (err) { /* ignore */ }
    musicBtn.classList.remove('visible');
    syncMusicUI();
    go('welcome');
  });

  /* ---------------------------------------------------------
     Resize handling
     --------------------------------------------------------- */
  window.addEventListener('resize', debounce(function () {
    fx.resize();
    heart.layout();
  }, 150));

  /* ---------------------------------------------------------
     Init
     --------------------------------------------------------- */
  buildFloaters();
  show('welcome');
  syncMusicUI();
})();
  </script>
</body>
</html>
